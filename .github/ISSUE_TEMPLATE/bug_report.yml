name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not report security issues here; see the Security tab or SECURITY.md.
        Never include real personal data. Use the demo production *The Last Withdrawal* or invented data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release number or commit hash.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker
        - Small mode
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: personal-data
    attributes:
      label: Personal data
      options:
        - label: I removed all real personal data
          required: true
